<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מתן לומד</title>
<style>
  :root{--bg:#0d0f1a;--card:#171a2b;--line:#2a2f4a;--text:#eef0ff;--muted:#9aa0c3;--accent:#7c5cff;--accent2:#22d3ee}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#1d1640,var(--bg) 60%);color:var(--text);font-family:system-ui,"Segoe UI",Arial,sans-serif}
  .app{max-width:760px;margin:0 auto;padding:16px;transition:.25s}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{margin:0;font-size:1.5rem;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  textarea,input{width:100%;background:#0f1222;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font:inherit;resize:vertical}
  textarea{min-height:110px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:var(--accent)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  button:disabled{opacity:.5;cursor:wait}
  .answer{white-space:pre-wrap;line-height:1.7}
  .muted{color:var(--muted);font-size:.9rem}
  .preview{max-height:140px;border-radius:10px;margin-top:8px;display:none}
  .hist-item{cursor:pointer;padding:8px;border-radius:8px;border-bottom:1px solid var(--line)}
  .hist-item:hover{background:#1f2340}
  .hidden{display:none!important}
  /* מזעור */
  body.min .app{display:none}
  #restore{position:fixed;bottom:16px;left:16px;width:52px;height:52px;border-radius:50%;font-size:1.4rem;box-shadow:0 6px 20px #0008}
</style>
</head>
<body>
<button id="restore" class="hidden" title="פתח">📚</button>

<div class="app">
  <header>
    <h1>📚 מתן לומד</h1>
    <button class="ghost" id="minBtn" title="מזעור">➖ מזעור</button>
  </header>

  <div class="card" id="loginCard">
    <div class="muted">סיסמה</div>
    <input type="password" id="pw" name="password" placeholder="הכנס סיסמה" autocomplete="current-password">
    <div class="row"><button id="loginBtn">כניסה</button></div>
  </div>

  <div id="main" class="hidden">
    <div class="card">
      <textarea id="q" placeholder="כתוב או הדבק שאלה... (Ctrl+Enter לשליחה)"></textarea>
      <img id="prev" class="preview" alt="">
      <div class="row">
        <button id="askBtn">⚡ תשובה</button>
        <button id="explainBtn" class="ghost">🧠 תסביר לי</button>
        <label class="ghost" style="padding:10px 16px;border:1px solid var(--line);border-radius:12px;cursor:pointer">📷 תמונה
          <input type="file" id="file" accept="image/*" class="hidden"></label>
        <button id="clearBtn" class="ghost">🗑️ נקה</button>
      </div>
    </div>

    <div class="card hidden" id="ansCard">
      <div class="answer" id="ans"></div>
      <div class="row">
        <button class="ghost" id="moreBtn">🧠 תסביר לי את זה</button>
        <button class="ghost" id="copyBtn">📋 העתק</button>
      </div>
    </div>

    <div class="card">
      <div class="muted">היסטוריה</div>
      <div id="hist"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch{ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} }
};
try{ localStorage.removeItem("pw") }catch{}
let password = "";
let image = null, last = null;

function showMain(){ $("loginCard").classList.add("hidden"); $("main").classList.remove("hidden"); renderHist(); $("q").focus(); }

$("loginBtn").onclick = async () => {
  const pw = $("pw").value; $("loginBtn").disabled = true;
  try{
    const r = await fetch("/api/ask", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ password: pw, check: true }) });
    if (r.ok){ password = pw; showMain(); }
    else { $("pw").value = ""; $("pw").placeholder = "❌ סיסמה שגויה, נסה שוב"; }
  }catch{ $("pw").placeholder = "❌ אין חיבור לשרת"; }
  $("loginBtn").disabled = false;
};
$("pw").onkeydown = e => { if (e.key === "Enter") $("loginBtn").click(); };

// מזעור ושחזור
function setMin(on){ document.body.classList.toggle("min", on); $("restore").classList.toggle("hidden", !on); }
$("minBtn").onclick = () => setMin(true);
$("restore").onclick = () => setMin(false);

$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { image = r.result; $("prev").src = image; $("prev").style.display = "block"; };
  r.readAsDataURL(f);
};

$("clearBtn").onclick = () => { $("q").value = ""; image = null; $("prev").style.display = "none"; $("ansCard").classList.add("hidden"); };

async function ask(question, img, explain, noGroq = false){
  const btns = [$("askBtn"), $("explainBtn"), $("moreBtn")];
  btns.forEach(b => b.disabled = true);
  $("ansCard").classList.remove("hidden");
  const out = $("ans");
  out.textContent = explain ? "🧠 חושב על הסבר..." : "⚡ חושב...";
  const send = () => fetch("/api/ask", {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ password, question, image: img, explain, noGroq })
  });
  try{
    let r = await send();
    if (r.status === 503){ // עומס זמני: ניסיון חוזר אחד
      out.textContent = "⏳ השרת עמוס, מנסה שוב...";
      await new Promise(res => setTimeout(res, 3000));
      r = await send();
    }
    if (r.status === 401){ location.reload(); return; }
    if (!r.ok || !r.body){
      const j = await r.json().catch(() => ({}));
      out.textContent = "❌ " + (j.error || `שגיאה (קוד ${r.status})`);
    } else {
      // קריאת הזרם (SSE) והצגת הטקסט תוך כדי שהוא מגיע
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "", text = "";
      for (;;){
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n"); buf = lines.pop();
        for (const line of lines){
          if (!line.startsWith("data:")) continue;
          try{
            const ev = JSON.parse(line.slice(5));
            for (const p of ev.candidates?.[0]?.content?.parts || [])   // Gemini
              if (p.text && !p.thought) text += p.text;
            text += ev.choices?.[0]?.delta?.content || "";               // Groq
            if (text) out.textContent = text;
          }catch{}
        }
      }
      // בדיקת איכות: אם נכנסו אותיות של שפה זרה (רוסית, ערבית, סינית, יפנית, קוריאנית), מבקשים מחדש מ-Gemini
      if (!noGroq && /[\u0400-\u04FF\u0600-\u06FF\u3040-\u30FF\u4E00-\u9FFF\uAC00-\uD7AF]/.test(text)){
        btns.forEach(b => b.disabled = false);
        out.textContent = "🔄 התשובה הכילה שפה זרה, מבקש תשובה נקייה...";
        return ask(question, img, explain, true);
      }
      const prov = r.headers.get("x-provider");
      if (text && prov){ const t = document.createElement("div"); t.className = "muted"; t.textContent = "מנוע: " + prov; out.appendChild(t); }
      if (!text) out.textContent = "❌ לא התקבלה תשובה, נסה שוב";
      else {
        last = { question, image: img };
        const h = store.get("hist", []);
        h.unshift({ q: question || "📷 תמונה", a: text });
        store.set("hist", h.slice(0, 30)); renderHist();
      }
    }
  }catch{ out.textContent = "❌ החיבור נקטע, נסה שוב"; }
  btns.forEach(b => b.disabled = false);
}

$("askBtn").onclick = () => ask($("q").value.trim(), image, false);
$("explainBtn").onclick = () => ask($("q").value.trim(), image, true);
$("moreBtn").onclick = () => last && ask(last.question, last.image, true);
$("copyBtn").onclick = () => navigator.clipboard?.writeText($("ans").textContent);
$("q").onkeydown = e => { if (e.key === "Enter" && e.ctrlKey) $("askBtn").click(); };

function renderHist(){
  const h = store.get("hist", []);
  $("hist").innerHTML = h.length ? "" : '<div class="muted">עוד אין שאלות</div>';
  h.forEach(it => {
    const d = document.createElement("div"); d.className = "hist-item";
    d.textContent = it.q.slice(0, 80);
    d.onclick = () => { $("ansCard").classList.remove("hidden"); $("ans").textContent = it.a; $("q").value = it.q.startsWith("📷") ? "" : it.q; };
    $("hist").appendChild(d);
  });
}
</script>
</body>
</html>
